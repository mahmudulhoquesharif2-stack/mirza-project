<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Student Account | At Taheel Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800;900&family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d13;
      --mint: #00e6a6;
      --mint-deep: #00c98f;
      --gold: #fbbf24;
      --white: #ffffff;
      --text: #cbd5e1;
      --muted: #94a3b8;
      --line: rgba(255, 255, 255, 0.12);
      --glass: rgba(255, 255, 255, 0.07);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--white);
      font-family: "Hind Siliguri", "Inter", system-ui, sans-serif;
      background:
        radial-gradient(circle at 82% 12%, rgba(0, 230, 166, 0.12), transparent 560px),
        radial-gradient(circle at 10% 88%, rgba(251, 191, 36, 0.08), transparent 520px),
        var(--bg);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .account-shell {
      width: min(100%, 520px);
      padding: 28px;
      border-radius: 22px;
      background: var(--glass);
      border: 1px solid var(--line);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      color: var(--mint);
      font-family: "Inter", sans-serif;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1.3px;
    }

    .brand img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 42px);
      line-height: 1.15;
      letter-spacing: 0;
    }

    p {
      margin: 12px 0 24px;
      color: var(--text);
      font-size: 17px;
      line-height: 1.7;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      color: var(--text);
      font-weight: 800;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 0 14px;
      border-radius: 12px;
      color: var(--white);
      font: inherit;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--line);
      outline: none;
    }

    input:focus {
      border-color: rgba(0, 230, 166, 0.55);
      box-shadow: 0 0 0 4px rgba(0, 230, 166, 0.08);
    }

    input[type="file"] {
      padding: 12px;
    }

    .preview {
      width: 92px;
      height: 92px;
      margin-top: 14px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--muted);
      font: 900 28px/1 "Inter", sans-serif;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      flex: 1;
      border-radius: 999px;
      border: 1px solid var(--line);
      font: 900 15px/1 "Hind Siliguri", "Inter", sans-serif;
      cursor: pointer;
    }

    .button.primary {
      color: #06110d;
      background: linear-gradient(180deg, var(--mint), var(--mint-deep));
      border-color: transparent;
    }

    .button.secondary {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      .account-shell {
        padding: 22px;
      }

      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="account-shell">
    <a class="brand" href="index.html">
      <img src="logo.png" alt="At Taheel Academy logo">
      <span>AT TAHEEL</span>
    </a>

    <h1>Create Student Account</h1>
    <p>Upload a student profile photo and basic details. After saving, the profile circle on the home page will show the uploaded photo.</p>

    <form id="student-form">
      <label for="student-name">Student name</label>
      <input id="student-name" name="name" type="text" autocomplete="name" required>

      <label for="student-email">Email or phone</label>
      <input id="student-email" name="contact" type="text" autocomplete="email" required>

      <label for="student-photo">Profile picture</label>
      <input id="student-photo" name="photo" type="file" accept="image/*" required>
      <div class="preview" id="photo-preview">+</div>

      <div class="actions">
        <button class="button primary" type="submit">Create Account</button>
        <a class="button secondary" href="index.html">Back</a>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById("student-form");
    const photoInput = document.getElementById("student-photo");
    const preview = document.getElementById("photo-preview");
    let selectedPhoto = "";

    photoInput.addEventListener("change", () => {
      const file = photoInput.files && photoInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.addEventListener("load", () => {
        selectedPhoto = reader.result;
        preview.textContent = "";
        const image = document.createElement("img");
        image.src = selectedPhoto;
        image.alt = "Selected profile preview";
        preview.appendChild(image);
      });
      reader.readAsDataURL(file);
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const profile = {
        name: document.getElementById("student-name").value.trim(),
        contact: document.getElementById("student-email").value.trim(),
        photo: selectedPhoto,
        createdAt: new Date().toISOString()
      };

      if (!profile.name || !profile.contact || !profile.photo) return;

      localStorage.setItem("studentProfile", JSON.stringify(profile));
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
